<script>

let medicines = [];
let billItems = [];

loadCustomers();
loadMedicines();

let customers = [];

const customerDropdown =
    document.getElementById("customerDropdown");

customerDropdown.addEventListener("click", function(e){

    let option =
        e.target.closest("div[data-id]");

    if(!option || !customerDropdown.contains(option))
        return;

    selectCustomer(
        option.dataset.id,
        option.dataset.name
    );

    customerIndex = -1;

});

function loadCustomers(){

fetch("/api/customers")
.then(res => res.json())
.then(data => {

    customers = data;

    if(document.getElementById("customerSearch").value.trim()){
        filterCustomers();
    }

});
}
function filterCustomers(event){
	 if(event &&
		      (event.key==="ArrowUp" ||
		       event.key==="ArrowDown" ||
		       event.key==="Enter" ||
		       event.key==="Escape")){
		        return;
		    }

	let search =
	document.getElementById("customerSearch")
	.value.toLowerCase();

	let dropdown =
	document.getElementById("customerDropdown");
	  // Search box blank asel tar dropdown close
    if(search === ""){

        dropdown.innerHTML = "";

        dropdown.style.display = "none";

        return;

    }
	dropdown.innerHTML = "";

	customers
	.filter(c =>
	String(c.customerName || "").toLowerCase().includes(search)
	)
	.forEach(c => {

		let option = document.createElement("div");
		option.dataset.id = c.id;
		option.dataset.name = c.customerName || "";
		option.textContent = c.customerName || "";
		option.style.padding = "8px";
		option.style.cursor = "pointer";
		dropdown.appendChild(option);

	});

	dropdown.style.display =
	dropdown.childElementCount ? "block" : "none";
	}
function selectCustomer(id, name){

    document.getElementById("customerSearch").value = name;

    document.getElementById("customerId").value = id;

    document.getElementById("customerDropdown").style.display = "none";
}function loadMedicines(){
	fetch("/api/medicines")
	.then(res => res.json())
	.then(data => {

	    medicines = data;

	});

}

function createMedicineSuggestionsTable(matchingMedicines){
	const table = document.createElement("table");
	table.className = "medicine-suggestions-table";
	const thead = document.createElement("thead");
	thead.innerHTML = "<tr><th>Medicine</th><th>Manufacturer</th><th>Available Qty</th><th>Schedule</th><th>Contents</th><th>Substitutes</th></tr>";
	const tbody = document.createElement("tbody");

	matchingMedicines.forEach(medicine => {
		const row = document.createElement("tr");
		row.dataset.medicineId = medicine.id;
		[
			medicine.medicineName || "",
			medicine.companyName || "Not specified",
			medicine.quantity ?? 0,
			medicine.scheduleType || "Not specified",
			medicine.contents || "Not specified",
			medicine.symptoms || "Not specified"
		].forEach(value => {
			const cell = document.createElement("td");
			cell.textContent = value;
			row.appendChild(cell);
		});
		tbody.appendChild(row);
	});

	table.append(thead, tbody);
	return table;
}

function updateMedicineReferenceDetails(medicine){
	document.getElementById("stockInfo").innerText = medicine.quantity ?? 0;
	document.getElementById("marginInfo").innerText = medicine.marginPercent ?? 0;
	document.getElementById("mrpInfo").innerText = medicine.mrp ?? 0;
	document.getElementById("purchasePriceInfo").innerText = medicine.purchasePrice ?? 0;
	document.getElementById("contentsInfo").innerText = medicine.contents || "-";
	document.getElementById("symptomsInfo").innerText = medicine.symptoms || medicine.substitutes || "-";
}

function renderTable(){

const body = document.getElementById("billBody");
body.replaceChildren();

billItems.forEach((item,index)=>{
	const row = document.createElement("tr");
	row.dataset.index = index;
	row.addEventListener("click", function(event){
		if(event.target.closest("button")) return;
		const item = billItems[index];
		const medicine = item.medicineId
			? medicines.find(entry => String(entry.id) === String(item.medicineId))
			: null;
		updateMedicineReferenceDetails(medicine || item);
	});

	const numberCell = document.createElement("td");
	numberCell.textContent = index + 1;
	row.appendChild(numberCell);

	[
		["companyName", "text", "Manufacturer", ""],
		["scheduleType", "text", "Schedule", ""],
		["batchNo", "text", "Batch number", ""],
		["gst", "number", "GST percentage", ""],
		["quantity", "number", "Quantity", ""],
		["unit", "text", "Unit", ""],
		["unitPrice", "number", "Rate", ""]
	].forEach(([field,type,label,extraClass])=>{
		const cell = document.createElement("td");
		const input = document.createElement("input");
		input.type = type;
		input.className = "bill-edit-input " + extraClass;
		input.value = item[field] ?? "";
		input.dataset.field = field;
		input.dataset.index = index;
		input.setAttribute("aria-label", label);
		if(type === "number"){
			input.min = "0";
			input.step = field === "quantity" ? "1" : "0.01";
		}
		input.addEventListener("input", function(){
			calculateRow(this);
		});
		cell.appendChild(input);
		row.appendChild(cell);
	});

	const medicineCell = document.createElement("td");
	const medicineEditor = document.createElement("div");
	medicineEditor.className = "bill-row-medicine-editor";
	const medicineInput = document.createElement("input");
	medicineInput.type = "text";
	medicineInput.className = "bill-edit-input bill-edit-input--medicine";
	medicineInput.value = item.medicineName || "";
	medicineInput.dataset.field = "medicineName";
	medicineInput.dataset.index = index;
	medicineInput.setAttribute("aria-label", "Medicine");
	medicineInput.autocomplete = "off";
	const rowDropdown = document.createElement("div");
	rowDropdown.className = "bill-row-medicine-dropdown";
	rowDropdown.setAttribute("aria-label", "Matching medicines");
	medicineInput.addEventListener("keydown", function(event){
		const options = rowDropdown.querySelectorAll("tr[data-medicine-id]");
		const activeIndex = Number(rowDropdown.dataset.activeIndex ?? -1);

		if((event.key === "ArrowDown" || event.key === "ArrowUp")
				&& rowDropdown.style.display !== "none"
				&& options.length){
			event.preventDefault();
			const direction = event.key === "ArrowDown" ? 1 : -1;
			const nextIndex = (activeIndex + direction + options.length) % options.length;
			rowDropdown.dataset.activeIndex = nextIndex;
			options.forEach((option, optionIndex) => {
				option.classList.toggle("keyboard-active", optionIndex === nextIndex);
			});
			options[nextIndex].scrollIntoView({block:"nearest"});
			return;
		}

		if(event.key === "Enter"
				&& rowDropdown.style.display !== "none"
				&& options[activeIndex]){
			event.preventDefault();
				selectMedicineForBillRow(
					index,
					options[activeIndex].dataset.medicineId,
					true
				);
			return;
		}

		if(event.key === "Escape"){
			rowDropdown.style.display = "none";
			rowDropdown.dataset.activeIndex = "-1";
		}
	});

	medicineInput.addEventListener("input", function(){
		calculateRow(this);
		openRowMedicineSuggestions(medicineEditor, rowDropdown, medicineInput.value);
	});
	medicineInput.addEventListener("click", function(){
		openRowMedicineSuggestions(medicineEditor, rowDropdown, medicineInput.value);
	});
	rowDropdown.addEventListener("click", function(event){
		const option = event.target.closest("tr[data-medicine-id]");
		if(!option || !rowDropdown.contains(option)) return;
		selectMedicineForBillRow(index, option.dataset.medicineId);
	});

	medicineEditor.append(medicineInput, rowDropdown);
	medicineCell.appendChild(medicineEditor);
	row.insertBefore(medicineCell, row.cells[1]);

	const amountCell = document.createElement("td");
	amountCell.className = "amount bill-line-amount";
	amountCell.textContent = Number(item.amount || 0).toFixed(2);
	row.appendChild(amountCell);

	const actionsCell = document.createElement("td");
	actionsCell.className = "bill-row-actions";
	const addButton = document.createElement("button");
	addButton.type = "button";
	addButton.className = "bill-row-action";
	addButton.setAttribute("aria-label", "Add another bill item");
	addButton.title = "Add another bill item";
	addButton.textContent = "+";
	addButton.addEventListener("click", function(){
		startNextBillItem();
	});

	const removeButton = document.createElement("button");
	removeButton.type = "button";
	removeButton.className = "bill-row-action bill-row-action--remove";
	removeButton.setAttribute("aria-label", "Remove medicine");
	removeButton.title = "Remove medicine";
	removeButton.textContent = "\u00d7";
	removeButton.addEventListener("click", function(){
		removeItem(index);
	});

	actionsCell.append(addButton, removeButton);
	row.appendChild(actionsCell);
	body.appendChild(row);
});

updateBillSubtotal();
document.getElementById("billingActions").hidden = !billItems.some(isBillItemReady);

calculateTotal();
}

function isBillItemReady(item){
	return Boolean(item.medicineName.trim())
		&& Number.isInteger(Number(item.quantity))
		&& Number(item.quantity) > 0
		&& item.unitPrice !== null
		&& item.unitPrice !== ""
		&& Number.isFinite(Number(item.unitPrice))
		&& Number(item.unitPrice) >= 0;
}

function openRowMedicineSuggestions(editor, dropdown, searchText){
	document.querySelectorAll(".bill-row-medicine-dropdown").forEach(openDropdown => {
		if(openDropdown !== dropdown){
			openDropdown.style.display = "none";
		}
	});

	renderRowMedicineSuggestions(dropdown, searchText);
	if(!dropdown.childElementCount){
		dropdown.style.display = "none";
		return;
	}

	const editorRect = editor.getBoundingClientRect();
	const viewportPadding = 12;
	const dropdownWidth = Math.min(1200, window.innerWidth - viewportPadding * 2);
	const dropdownHeight = Math.min(320, window.innerHeight - viewportPadding * 2);
	const availableBelow = window.innerHeight - editorRect.bottom - viewportPadding;
	const placeBelow = availableBelow >= Math.min(160, dropdownHeight);

	dropdown.style.display = "block";
	dropdown.style.width = dropdownWidth + "px";
	dropdown.style.maxHeight = Math.max(
		120,
		Math.min(dropdownHeight, placeBelow ? availableBelow : editorRect.top - viewportPadding)
	) + "px";
	dropdown.style.left = Math.max(
		viewportPadding,
		Math.min(editorRect.left, window.innerWidth - dropdownWidth - viewportPadding)
	) + "px";
	dropdown.style.top = (placeBelow
		? editorRect.bottom + 4
		: Math.max(viewportPadding, editorRect.top - dropdown.offsetHeight - 4)
	) + "px";
}

function renderRowMedicineSuggestions(dropdown, searchText){
	const search = String(searchText || "").trim().toLowerCase();
	dropdown.replaceChildren();
	dropdown.dataset.activeIndex = "-1";

	const matchingMedicines = medicines.filter(m =>
		!search || [
			m.medicineName,
			m.companyName,
			m.contents,
			m.symptoms
		].some(value => String(value || "").toLowerCase().includes(search))
	);
	if(!matchingMedicines.length) return;

	dropdown.appendChild(createMedicineSuggestionsTable(matchingMedicines));
}

function selectMedicineForBillRow(index, medicineId, focusNextRow = false){
	const medicine = medicines.find(item => String(item.id) === String(medicineId));
	const billItem = billItems[index];
	if(!medicine || !billItem) return;

	const existingQuantity = Number(billItem.quantity);
	billItem.medicineId = medicine.id;
	billItem.inventoryMedicineName = medicine.medicineName;
	billItem.medicineName = medicine.medicineName || "";
	billItem.companyName = medicine.companyName || "";
	billItem.scheduleType = medicine.scheduleType || "";
	billItem.batchNo = medicine.batchNo || "";
	billItem.contents = medicine.contents || "";
	billItem.substitutes = medicine.symptoms || "";
	billItem.unit = medicine.unit || "";
	billItem.unitPrice = Number(medicine.mrp) || 0;
	billItem.gst = Number(medicine.gstPercent) || 0;
	billItem.quantity = Number.isInteger(existingQuantity) && existingQuantity > 0
		? existingQuantity
		: 1;
	billItem.amount = billItem.quantity * billItem.unitPrice;

	updateMedicineReferenceDetails(medicine);

	renderTable();
	if(focusNextRow){
		let nextIndex = billItems.findIndex(
			(item, itemIndex) => itemIndex > index && !item.medicineName.trim()
		);
		if(nextIndex < 0){
			startNextBillItem("", "", false);
			nextIndex = billItems.length - 1;
		}
		const nextMedicineInput = document.querySelector(
			"#billBody tr[data-index='" + nextIndex + "'] input[data-field='medicineName']"
		);
		if(nextMedicineInput) nextMedicineInput.focus();
	}
}

function updateBillSubtotal(){
	const subtotal = billItems.reduce((sum,item)=>sum + (Number(item.amount) || 0),0);
	document.getElementById("subTotal").innerText = subtotal.toFixed(2);
}

function removeItem(index){

billItems.splice(index,1);

if(billItems.length === 0){
	startNextBillItem("", "", false);
}else{
	renderTable();
}

}

function calculateRow(element){
	const row = element.closest("tr");
	const index = Number(element.dataset.index);
	const field = element.dataset.field;
	const item = billItems[index];
	if(!row || !item || !field) return;

	const numericFields = ["gst", "quantity", "unitPrice"];
	item[field] = numericFields.includes(field)
		? element.value === "" ? null : Number(element.value)
		: element.value;

	if(field === "medicineName"
			&& item.medicineId
			&& item.medicineName.trim() !== item.inventoryMedicineName){
		item.medicineId = null;
	}

	const quantity = Number(item.quantity) || 0;
	const rate = Number(item.unitPrice) || 0;
	item.amount = quantity * rate;
	row.querySelector(".bill-line-amount").textContent = item.amount.toFixed(2);
	document.getElementById("billingActions").hidden = !billItems.some(isBillItemReady);
	calculateBillTotal();
}

function calculateTotal(){

    let subTotal = Number(
        document.getElementById("subTotal").innerText
    ) || 0;

    let discountPercent = Number(
        document.getElementById("discount").value
    ) || 0;

    let discountAmount =
        (subTotal * discountPercent) / 100;

    let netAmount =
        subTotal - discountAmount;

    document.getElementById("netTotal").value =
        netAmount.toFixed(2);

    // Cash / Credit Logic
    let billType =
        document.getElementById("billType").value;

    if(billType === "Cash"){

        document.getElementById("paidAmount").value =
            netAmount.toFixed(2);

    }else{

        document.getElementById("paidAmount").value = "0";

    }

}
function calculateBillTotal(){

	updateBillSubtotal();
    calculateTotal();
}

function focusField(id){

   if(!el || el.closest("[hidden]")) return;

       el.select();
   }

}

	if(index < 0){

	const input = document.querySelector(

/*-------------------------
Customer Keyboard

document.getElementById("customerSearch").addEventListener("keydown",function(e){

   let dropdown=document.getElementById("customerDropdown");

   let items=document.querySelectorAll("#customerDropdown div");

   // DOWN
   if(e.key==="ArrowDown"){

       if(items.length===0) return;

       e.preventDefault();

       customerIndex++;

       if(customerIndex>=items.length)
           customerIndex=0;

       items.forEach(x=>{
           x.style.background="";
           x.style.color="";
       });

       items[customerIndex].style.background="#0d6efd";
       items[customerIndex].style.color="white";
       items[customerIndex].scrollIntoView({
    	    behavior:"smooth",
    	    block:"nearest"
    	});

       return;
   }

   // UP
   if(e.key==="ArrowUp"){

       if(items.length===0) return;

       e.preventDefault();

       customerIndex--;

       if(customerIndex<0)
           customerIndex=items.length-1;

       items.forEach(x=>{
           x.style.background="";
           x.style.color="";
       });

       items[customerIndex].style.background="#0d6efd";
       items[customerIndex].style.color="white";
       items[customerIndex].scrollIntoView({
    	    behavior:"smooth",
    	    block:"nearest"
    	});

       return;
   }

   // ESC
   if(e.key==="Escape"){

       dropdown.style.display="none";
       customerIndex=-1;
       return;
   }

   // ENTER
   if(e.key==="Enter"){

       e.preventDefault();

       // Agar dropdown me item select hai
       if(items.length>0 && customerIndex>=0){

           items[customerIndex].click();

       }

       dropdown.style.display="none";

       customerIndex=-1;

       focusField("billType");

   }

});

let typeOpen = false;

const billType = document.getElementById("billType");

billType.addEventListener("keydown", function(e){

   // ENTER
   if(e.key === "Enter"){

       e.preventDefault();

       // First Enter -> open dropdown
       if(!typeOpen){

           typeOpen = true;

           // Edge/Chrome
           if(this.showPicker){
               this.showPicker();
           }else{
               this.click();
           }

           return;
       }

       // Second Enter -> confirm
       typeOpen = false;

       focusBillMedicine();

       return;
   }

   // ESC
   if(e.key === "Escape"){

       typeOpen = false;

       this.blur();

   }

   // UP & DOWN browser automatically handle karega
});

document.addEventListener("keydown", function(event){
	const tableContainer = document.querySelector(".table-container");
	if(document.activeElement === tableContainer){
		const scrollAmount = 40;
		switch(event.key){
			case "ArrowUp":
				tableContainer.scrollTop -= scrollAmount;
				break;
			case "ArrowDown":
				tableContainer.scrollTop += scrollAmount;
				break;
			case "ArrowLeft":
				tableContainer.scrollLeft -= scrollAmount;
				break;
			case "ArrowRight":
				tableContainer.scrollLeft += scrollAmount;
				break;
			default:
				return;
		}
		event.preventDefault();
		return;
	}

	if((document.activeElement === document.body
			|| document.activeElement === document.documentElement)
			&& (event.key === "ArrowLeft" || event.key === "ArrowRight")
			&& tableContainer.scrollWidth > tableContainer.clientWidth){
		tableContainer.scrollLeft += event.key === "ArrowRight" ? 40 : -40;
		event.preventDefault();
		return;
	}

	if(event.defaultPrevented
			|| (event.key !== "ArrowDown" && event.key !== "ArrowUp")) return;

	const focusable = Array.from(document.querySelectorAll(
		'input:not([type="hidden"]), select, textarea, button, a[href], [tabindex]:not([tabindex="-1"])'
	)).filter(element =>
		!element.disabled
		&& !element.closest("[hidden], [aria-hidden='true']")
		&& element.getClientRects().length > 0
		&& getComputedStyle(element).visibility !== "hidden"
	);
	const currentIndex = focusable.indexOf(document.activeElement);
	if(currentIndex < 0) return;

	const nextIndex = currentIndex + (event.key === "ArrowDown" ? 1 : -1);
	if(nextIndex < 0 || nextIndex >= focusable.length) return;

	event.preventDefault();
	focusable[nextIndex].focus();
});
