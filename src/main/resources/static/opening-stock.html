<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/table-scroll.css">
<script src="/table-scroll.js" defer></script>
<meta charset="UTF-8">
<title>Opening Stock Entry</title>

<style>

body{
    font-family:"Segoe UI",Arial;
    background:#eef3f8;
    margin:0;
}


/* HEADER */

.header{

    background:linear-gradient(135deg,#0f4c81,#2196f3);

    color:white;

    padding:18px;

    font-size:28px;

    font-weight:bold;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    box-shadow:0 3px 10px rgba(0,0,0,.2);

}


.logo{

    position:absolute;

    left:20px;

    height:60px;

    width:170px;

    border-radius:15px;

}



.close-btn{

    position:absolute;

    right:20px;

    background:#dc3545;

    color:white;

    border:none;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

}



.close-btn:hover{

    background:#bb2d3b;

}


/* MAIN */

.container{

    padding:20px;

}



.card{

    background:white;

    padding:15px 20px;

    border-radius:10px;

    box-shadow:0 3px 10px rgba(0,0,0,.15);

    margin-bottom:15px;

}



h2{

    color:#0f4c81;

    margin:0 0 15px;

    border-bottom:2px solid #2196f3;

    padding-bottom:8px;

}



.row{

    display:flex;

    gap:15px;

    align-items:flex-end;

}


.field{

    flex:1;

}



label{

    font-size:14px;

    font-weight:600;

    color:#444;

}



input,
select{

    width:100%;

    height:38px;

    box-sizing:border-box;

    padding:8px 10px;

    margin-top:5px;

    border:1px solid #ccc;

    border-radius:6px;

}



input:focus,
select:focus{

    outline:none;

    border-color:#2196f3;

}



/* BUTTON */

.btn{

    width:180px;

    height:40px;

    background:#0f4c81;

    color:white;

    border:none;

    border-radius:7px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

}



.btn:hover{

    background:#0b3d68;

}



/* TABLE */

table{

    width:100%;

    border-collapse:collapse;

    margin-top:10px;

}



th{

    background:#0f4c81;

    color:white;

    padding:10px;

}



td{

    padding:8px;

    border:1px solid #ddd;

    text-align:center;

}
#medicineDropdown div{
    padding:10px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

#medicineDropdown div:hover,
#medicineDropdown div.active{
    background:#2196f3;
    color:white;
}

</style>

<link rel="stylesheet" href="/app-popups.css">
<script src="/app-popups.js"></script>
<script src="/medicine-search.js?v=2"></script>
</head>

<body>

<div class="header">

<img src="/images/logo.jpeg" class="logo">

<span>Opening Stock Entry</span>

<button class="close-btn" onclick="closePage()">
✖ Close
</button>

</div>



<div class="container">


<div class="card">


<h2>Opening Stock Details</h2>


<div class="row">


<div class="field">

<label>Medicine</label>

<div style="position:relative;">

    <input
        type="text"
        id="medicineSearch"
        placeholder="Search Medicine..."
        autocomplete="off"
    >

    <input type="hidden" id="medicine">

    <div id="medicineDropdown"
        style="
            display:none;
            position:absolute;
            top:45px;
            left:0;
            width:100%;
            max-height:220px;
            overflow-y:auto;
            background:white;
            border:1px solid #ccc;
            border-radius:6px;
            box-shadow:0 3px 10px rgba(0,0,0,.2);
            z-index:9999;
        ">
    </div>

</div>

</div>


<div class="field">

<label>Opening Quantity</label>

<input type="number" id="quantity">

</div>



<div class="field">

<label>Opening Date</label>

<input type="date" id="openingDate">

</div>



<div class="field">

<button id="saveBtn" class="btn" onclick="saveOpeningStock()">

Save Stock

</button>

</div>



</div>


</div>



<div class="card">


<h2>Opening Stock History</h2>


<table>

<thead>

<tr>

<th>ID</th>

<th>Medicine</th>

<th>Quantity</th>

<th>Date</th>

</tr>

</thead>


<tbody id="stockTable">

</tbody>


</table>


</div>


</div>
<script>

setupMedicinePrefixSearch({
    inputId: "medicineSearch",
    dropdownId: "medicineDropdown",
    hiddenInputId: "medicine",
    nextFocusId: "quantity"
});


/* =====================================================
   SAVE OPENING STOCK
===================================================== */

function saveOpeningStock(){

    const medicineId =
        document.getElementById("medicine").value;

    const quantity =
        document.getElementById("quantity").value;

    const openingDate =
        document.getElementById("openingDate").value;


    /* =========================
       VALIDATION
    ========================= */

    if(!medicineId){

        alert("Please select Medicine.");

        document.getElementById("medicineSearch").focus();

        return;

    }


    if(!quantity || Number(quantity) <= 0){

        alert("Please enter Opening Quantity.");

        document.getElementById("quantity").focus();

        return;

    }


    if(!openingDate){

        alert("Please select Opening Date.");

        document.getElementById("openingDate").focus();

        return;

    }


    const data = {

        medicineId: medicineId,

        quantity: quantity,

        openingDate: openingDate

    };


    fetch("/api/opening-stock",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    })

    .then(res => res.json())

    .then(data => {

        appPopups.alert("Opening Stock Added").then(() => location.reload());

    })

    .catch(error => {

        console.error("Save error:", error);

        alert("Failed to save Opening Stock.");

    });

}


/* =====================================================
   OPENING STOCK HISTORY
===================================================== */

function loadOpeningStockHistory(){

    fetch("/api/opening-stock")

    .then(res => res.json())

    .then(data => {

        let rows = "";


        data.forEach(function(s){

            rows += `
                <tr>

                    <td>${s.id}</td>

                    <td>
                        ${s.medicine ?
                        s.medicine.medicineName : ""}
                    </td>

                    <td>${s.quantity}</td>

                    <td>${s.openingDate}</td>

                </tr>
            `;

        });


        document.getElementById("stockTable")
            .innerHTML = rows;

    })

    .catch(error => {

        console.error(
            "Opening stock history error:",
            error
        );

    });

}
/* =====================================================
LEFT / RIGHT ARROW = PREVIOUS / NEXT FIELD
===================================================== */

document.addEventListener("keydown", function(e){

 if(
     e.key !== "ArrowLeft" &&
     e.key !== "ArrowRight"
 ){
     return;
 }

 let active = document.activeElement;


 /* Medicine Search मध्ये Left/Right normal typing राहू द्या */
 if(active.id === "medicineSearch"){
     return;
 }


 /* Date field मध्ये browser चे normal behavior */
 if(active.type === "date"){
     return;
 }


 /*
  * फक्त form fields घ्या
  */

 let fields = Array.from(
     document.querySelectorAll(
         'input:not([type="hidden"]):not([disabled]),' +
         'select:not([disabled]),' +
         'button:not([disabled])'
     )
 ).filter(function(el){

     return el.offsetParent !== null;

 });


 let index = fields.indexOf(active);


 if(index === -1)
     return;


 /* =========================
    RIGHT ARROW
    Next Field
 ========================= */

 if(e.key === "ArrowRight"){

     if(index < fields.length - 1){

         e.preventDefault();

         fields[index + 1].focus();

     }

     return;
 }


 /* =========================
    LEFT ARROW
    Previous Field
 ========================= */

 if(e.key === "ArrowLeft"){

     if(index > 0){

         e.preventDefault();

         fields[index - 1].focus();

     }

     return;
 }

});

/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener("keydown", function(e){

    if(e.key !== "Enter")
        return;


    if(
        document.activeElement.tagName === "TEXTAREA"
    )
        return;


    let active =
        document.activeElement;


    /* =========================================
       MEDICINE SEARCH
    ========================================= */

    if(active.id === "medicineSearch"){

        /*
         * Medicine चा स्वतःचा
         * keydown handler काम करेल.
         */

        return;

    }


    /* =========================================
       SAVE BUTTON
       Enter -> Save
    ========================================= */

    if(active.id === "saveBtn"){

        e.preventDefault();

        e.stopPropagation();

        saveOpeningStock();

        return;

    }


    /* =========================================
       NORMAL FIELDS
       Enter -> NEXT FIELD
    ========================================= */

    e.preventDefault();

    e.stopPropagation();


    let fields = Array.from(
        document.querySelectorAll(
            'input:not([type="hidden"]):not([disabled]),' +
            'select:not([disabled]),' +
            'button:not([disabled])'
        )
    )
    .filter(function(el){

        return el.offsetParent !== null;

    });


    let index =
        fields.indexOf(active);


    if(
        index > -1 &&
        index < fields.length - 1
    ){

        fields[index + 1].focus();

    }

});


/* =====================================================
   PAGE LOAD
===================================================== */

window.onload = function(){

    loadOpeningStockHistory();


    // =========================
    // TODAY'S DATE
    // =========================

    const today = new Date();

    const year = today.getFullYear();

    const month = String(
        today.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        today.getDate()
    ).padStart(2, "0");


    document.getElementById("openingDate").value =
        `${year}-${month}-${day}`;


    // =========================
    // FIRST CURSOR
    // =========================

    document
        .getElementById("medicineSearch")
        .focus();

};

/* =====================================================
   CLOSE
===================================================== */

function closePage(){

    if (window.parent !== window && typeof window.parent.closeModal === "function") {
        window.parent.closeModal();
    } else {
        window.location.href = "dashboard.html";
    }

}

</script>
</body>
</html>
